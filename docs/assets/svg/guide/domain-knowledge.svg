<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"
     aria-label="현장 지식 모으기 흐름도"
     class="zoomable">
  <title>현장 지식 모으기</title>
  <desc>베테랑 설명을 듣고, 공정별 문장으로 정리하고, 질문과 답을 만든 뒤, 다시 확인하는 4 단계 흐름도.</desc>

  <defs>
    <linearGradient id="dk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="dk-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="dk-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="dk-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <style>
      .ko { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-weight: 800; }
      .ko-m { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-weight: 650; }
      .ko-r { font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; font-weight: 500; }
      .small { font-size: 16px; }
    </style>
  </defs>

  <rect width="960" height="540" rx="0" fill="url(#dk-bg)"/>

  <g transform="translate(48, 42)">
    <rect width="864" height="118" rx="8" fill="url(#dk-head)" filter="url(#dk-shadow)"/>
    <circle cx="760" cy="58" r="34" fill="rgba(255,255,255,0.16)"/>
    <circle cx="805" cy="40" r="18" fill="rgba(255,255,255,0.16)"/>
    <text x="34" y="49" class="ko" font-size="32" fill="#FFFFFF">현장 지식 모으기</text>
    <text x="36" y="82" class="ko-r" font-size="18" fill="#E0F2FE">베테랑 설명을 문서·질문·검증 기준으로 바꿔 AI가 참고하게 합니다</text>
    <text x="36" y="106" class="ko-m" font-size="15" fill="#FEF3C7">목표: 머릿속 판단을 누구나 다시 확인할 수 있는 자료로 남기기</text>
  </g>

  <g transform="translate(54, 205)">
    <g filter="url(#dk-shadow)">
      <rect x="0" y="0" width="190" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="34" cy="34" r="20" fill="url(#dk-accent)"/>
      <text x="34" y="41" text-anchor="middle" class="ko" font-size="18" fill="#FFFFFF">1</text>
      <text x="64" y="38" class="ko" font-size="23" fill="#0F172A">묻기</text>
      <text x="22" y="78" class="ko-m small" fill="#334155">핵심 판단 기준을</text>
      <text x="22" y="103" class="ko-m small" fill="#334155">베테랑에게 듣습니다</text>
      <text x="22" y="130" class="ko-r" font-size="14" fill="#64748B">언제, 왜 그렇게 보는지 확인</text>
    </g>

    <path d="M207 77 H252" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 77 l-13 -9 v18 z" fill="#94A3B8"/>

    <g transform="translate(270,0)" filter="url(#dk-shadow)">
      <rect x="0" y="0" width="190" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="34" cy="34" r="20" fill="#6366F1"/>
      <text x="34" y="41" text-anchor="middle" class="ko" font-size="18" fill="#FFFFFF">2</text>
      <text x="64" y="38" class="ko" font-size="23" fill="#0F172A">정리</text>
      <text x="22" y="78" class="ko-m small" fill="#334155">녹취와 메모를</text>
      <text x="22" y="103" class="ko-m small" fill="#334155">공정별 문장으로 묶습니다</text>
      <text x="22" y="130" class="ko-r" font-size="14" fill="#64748B">중복 표현은 하나로 통일</text>
    </g>

    <path d="M477 77 H522" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M522 77 l-13 -9 v18 z" fill="#94A3B8"/>

    <g transform="translate(540,0)" filter="url(#dk-shadow)">
      <rect x="0" y="0" width="190" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="34" cy="34" r="20" fill="#0F766E"/>
      <text x="34" y="41" text-anchor="middle" class="ko" font-size="18" fill="#FFFFFF">3</text>
      <text x="64" y="38" class="ko" font-size="23" fill="#0F172A">문답 만들기</text>
      <text x="22" y="78" class="ko-m small" fill="#334155">자주 묻는 질문과</text>
      <text x="22" y="103" class="ko-m small" fill="#334155">답을 짝으로 만듭니다</text>
      <text x="22" y="130" class="ko-r" font-size="14" fill="#64748B">근거가 되는 문장도 함께 보관</text>
    </g>

    <path d="M747 77 H792" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M792 77 l-13 -9 v18 z" fill="#94A3B8"/>

    <g transform="translate(810,0)" filter="url(#dk-shadow)">
      <rect x="0" y="0" width="96" height="154" rx="8" fill="#0F172A"/>
      <circle cx="48" cy="34" r="20" fill="#10B981"/>
      <text x="48" y="41" text-anchor="middle" class="ko" font-size="18" fill="#FFFFFF">4</text>
      <text x="48" y="72" text-anchor="middle" class="ko" font-size="22" fill="#FFFFFF">확인</text>
      <text x="48" y="101" text-anchor="middle" class="ko-r" font-size="14" fill="#CBD5E1">맞는지 보고</text>
      <text x="48" y="123" text-anchor="middle" class="ko-r" font-size="14" fill="#CBD5E1">계속 고칩니다</text>
    </g>
  </g>

  <g transform="translate(48, 400)" filter="url(#dk-shadow)">
    <rect width="864" height="92" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="0" y="0" width="158" height="92" rx="8" fill="#EEF2FF"/>
    <text x="28" y="38" class="ko" font-size="22" fill="#4338CA">남는 결과</text>
    <text x="28" y="64" class="ko-r" font-size="15" fill="#475569">바로 쓰는 자료</text>

    <g transform="translate(194,22)">
      <rect width="138" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="69" y="31" text-anchor="middle" class="ko-m" font-size="17" fill="#334155">인터뷰 메모</text>
    </g>
    <g transform="translate(350,22)">
      <rect width="138" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="69" y="31" text-anchor="middle" class="ko-m" font-size="17" fill="#334155">질문·답 세트</text>
    </g>
    <g transform="translate(506,22)">
      <rect width="138" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="69" y="31" text-anchor="middle" class="ko-m" font-size="17" fill="#334155">검증 기준</text>
    </g>
    <g transform="translate(662,22)">
      <rect width="158" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="79" y="31" text-anchor="middle" class="ko-m" font-size="17" fill="#334155">AI 답변 점검표</text>
    </g>
  </g>
</svg>
